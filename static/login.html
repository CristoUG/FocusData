<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FocusData — Iniciar sesión</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="/static/css/tokens.css">
  <script>
    // Misma apariencia que la última vez que se usó la app en este navegador.
    // Los fondos propios necesitan sesión iniciada, así que aquí se usa una escena del catálogo.
    (function () {
      var presets = { road: ['#E8875F', '#B77AA8', '#F2B36F'], blossom: ['#E59BC4', '#78B4E4', '#B69AD8'] };
      var a = {};
      try { a = JSON.parse(localStorage.getItem('focusdata.appearance') || '{}') || {}; } catch (e) { a = {}; }
      var root = document.documentElement;
      root.setAttribute('data-theme', a.theme === 'light' ? 'light' : 'dark');
      var id = presets[a.scene] ? a.scene : 'road';
      presets[id].forEach(function (c, i) { root.style.setProperty('--s' + (i + 1), c); });
      root.style.setProperty('--photo', 'url("/static/scenes/' + id + '.jpg")');
      root.classList.add('has-photo');
    })();
  </script>
  <style>
    body { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 32px 16px; overflow-x: hidden; }
    .scene { position: fixed; }
    .auth { position: relative; z-index: 1; width: 100%; max-width: 420px; display: flex; flex-direction: column; align-items: center; text-align: center; }
    .auth-brand {
      display: inline-flex; align-items: center; gap: 10px; padding: 6px 16px 6px 6px; border-radius: 22px;
      font-family: var(--f-display); font-weight: 600; font-size: 16px;
      background: var(--surface); border: 1px solid var(--line); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    }
    .brand-logo {
      width: 30px; height: 30px; border-radius: 10px 10px 10px 4px; display: grid; place-items: center; color: #fff;
      background: conic-gradient(from 210deg, var(--s1), var(--s2), var(--s3), var(--s1));
    }
    .brand-logo .ic { width: 17px; height: 17px; }
    .auth h1 {
      margin: 18px 0 6px; font-family: var(--f-display); font-size: 30px; line-height: 38px; font-weight: 600;
      letter-spacing: -.015em; text-wrap: balance; color: var(--on-photo); text-shadow: var(--photo-shadow);
    }
    .auth-sub { font-size: 14.5px; line-height: 22px; margin-bottom: 22px; color: var(--on-photo-muted); text-shadow: var(--photo-shadow); }
    .auth-card {
      width: 100%; text-align: left; padding: 18px 20px 22px; border-radius: 24px;
      background: color-mix(in srgb, var(--surface-solid) 84%, transparent); border: 1px solid var(--line);
      -webkit-backdrop-filter: blur(22px) saturate(120%); backdrop-filter: blur(22px) saturate(120%); box-shadow: var(--menu-shadow);
    }
    .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border-radius: 14px; background: var(--hover); margin-bottom: 14px; }
    .seg button { height: 36px; border: 0; border-radius: 10px; background: none; color: var(--muted); font-weight: 600; }
    .seg button:hover { color: var(--text); }
    .seg button[aria-selected="true"] { background: var(--surface-solid); color: var(--text); box-shadow: 0 1px 3px rgba(0, 0, 0, .14); }
    .lbl { display: block; font-size: 12.5px; font-weight: 600; color: var(--muted); margin: 14px 0 6px; }
    .input {
      display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 14px; border-radius: 14px;
      border: 1px solid var(--line); background: var(--surface-solid); transition: border-color .15s;
    }
    .input:focus-within { border-color: color-mix(in srgb, var(--text) 40%, transparent); }
    .input .ic { color: var(--muted); }
    .input input { flex: 1; min-width: 0; height: 100%; border: 0; background: none; outline: none; font-size: 15px; }
    .input input::placeholder { color: var(--muted); }
    .input input:-webkit-autofill { -webkit-box-shadow: 0 0 0 40px var(--surface-solid) inset; -webkit-text-fill-color: var(--text); }
    .pass-hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
    .auth-submit { width: 100%; height: 46px; border-radius: 23px; margin-top: 20px; font-size: 15px; }
    .msg { display: flex; align-items: flex-start; gap: 8px; padding: 10px 12px; border-radius: 12px; font-size: 13px; line-height: 19px; margin-bottom: 4px; }
    .msg .ic { margin-top: 0; }
    .msg.error { background: color-mix(in srgb, var(--danger-solid) 14%, transparent); color: var(--danger); }
    .msg.ok { background: color-mix(in srgb, #107C10 18%, transparent); color: var(--good); }
    .spinner { width: 18px; height: 18px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--ink-fg) 30%, transparent); border-top-color: var(--ink-fg); animation: spin .6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .auth-foot { margin-top: 16px; font-size: 12.5px; color: var(--on-photo-muted); text-shadow: var(--photo-shadow); }
  </style>
</head>
<body>

<div class="scene" aria-hidden="true">
  <div class="scene-photo"></div>
  <div class="scene-amb"></div>
</div>

<main class="auth">
  <span class="auth-brand">
    <span class="brand-logo"><svg class="ic" aria-hidden="true"><use href="/static/img/icons.svg#i-timer"/></svg></span>FocusData
  </span>
  <h1>Tu tiempo de estudio, claro y medible</h1>
  <p class="auth-sub muted">Entra para seguir con tus sesiones, carpetas y estadísticas.</p>

  <section class="auth-card">
    <div class="seg" role="tablist" aria-label="Acceso">
      <button type="button" role="tab" id="tab-login" aria-selected="true">Iniciar sesión</button>
      <button type="button" role="tab" id="tab-register" aria-selected="false">Crear cuenta</button>
    </div>

    <div class="msg error" id="error-msg" role="alert" hidden>
      <svg class="ic s16" aria-hidden="true"><use href="/static/img/icons.svg#i-error"/></svg><span id="error-text"></span>
    </div>
    <div class="msg ok" id="success-msg" role="status" hidden>
      <svg class="ic s16" aria-hidden="true"><use href="/static/img/icons.svg#i-check-circle"/></svg><span id="success-text"></span>
    </div>

    <form id="auth-form" novalidate>
      <label class="lbl" for="username">Usuario</label>
      <div class="input">
        <svg class="ic" aria-hidden="true"><use href="/static/img/icons.svg#i-person"/></svg>
        <input type="text" id="username" placeholder="Tu nombre de usuario" autocomplete="username" minlength="3" maxlength="30" required>
      </div>

      <label class="lbl" for="password">Contraseña</label>
      <div class="input">
        <svg class="ic" aria-hidden="true"><use href="/static/img/icons.svg#i-lock"/></svg>
        <input type="password" id="password" placeholder="Tu contraseña" autocomplete="current-password" required>
      </div>
      <p class="pass-hint" id="pass-hint" hidden>Usa al menos 8 caracteres.</p>

      <button type="submit" class="btn primary auth-submit" id="btn-submit">
        <svg class="ic" id="btn-icon" aria-hidden="true"><use href="/static/img/icons.svg#i-enter"/></svg>
        <span id="btn-text">Iniciar sesión</span>
      </button>
    </form>
  </section>
  <p class="auth-foot muted">Tus sesiones se guardan en tu cuenta y te siguen en cualquier dispositivo.</p>
</main>

<script>
  var ICONS = '/static/img/icons.svg';
  var mode = 'login';
  var $ = function (id) { return document.getElementById(id); };

  function switchMode(next) {
    mode = next;
    var register = next === 'register';
    $('tab-login').setAttribute('aria-selected', String(!register));
    $('tab-register').setAttribute('aria-selected', String(register));
    $('btn-text').textContent = register ? 'Crear cuenta' : 'Iniciar sesión';
    $('btn-icon').querySelector('use').setAttribute('href', ICONS + '#i-' + (register ? 'person-add' : 'enter'));
    $('password').setAttribute('autocomplete', register ? 'new-password' : 'current-password');
    $('pass-hint').hidden = !register;
    hideMessages();
  }

  function hideMessages() {
    $('error-msg').hidden = true;
    $('success-msg').hidden = true;
  }
  function showError(msg) {
    hideMessages();
    $('error-text').textContent = msg;
    $('error-msg').hidden = false;
  }
  function showSuccess(msg) {
    hideMessages();
    $('success-text').textContent = msg;
    $('success-msg').hidden = false;
  }

  $('tab-login').addEventListener('click', function () { switchMode('login'); });
  $('tab-register').addEventListener('click', function () { switchMode('register'); });

  $('auth-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    hideMessages();
    var username = $('username').value.trim();
    var password = $('password').value;
    if (!username || !password) { showError('Escribe tu usuario y tu contraseña.'); return; }
    if (mode === 'register' && password.length < 8) { showError('La contraseña debe tener al menos 8 caracteres.'); return; }

    var btn = $('btn-submit'), icon = $('btn-icon'), text = $('btn-text');
    var originalText = text.textContent;
    var spinner = document.createElement('span');
    spinner.className = 'spinner';
    btn.disabled = true;
    icon.replaceWith(spinner);
    text.textContent = mode === 'register' ? 'Creando cuenta…' : 'Entrando…';

    var redirecting = false;
    try {
      var res = await fetch(mode === 'login' ? '/api/login' : '/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: username, password: password })
      });
      var data = {};
      try { data = await res.json(); } catch (err) { data = {}; }
      if (!res.ok) { showError(data.error || 'No se pudo completar. Inténtalo de nuevo.'); return; }
      if (mode === 'register') showSuccess('Cuenta creada. Entrando…');
      redirecting = true;
      setTimeout(function () { window.location.href = '/'; }, 400);
    } catch (err) {
      showError('No hay conexión con el servidor. Revisa tu internet e inténtalo de nuevo.');
    } finally {
      if (!redirecting) {
        btn.disabled = false;
        spinner.replaceWith(icon);
        text.textContent = originalText;
      }
    }
  });

  $('username').focus();
</script>
</body>
</html>
