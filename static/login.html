<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FocusData — Iniciar Sesión</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  
  <style>
    :root {
      --bg-color: #060910;
      --card-bg: rgba(23, 32, 50, 0.45);
      --card-border: rgba(255, 255, 255, 0.09);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.5);
      --accent-hover: #2563eb;
      --danger: #ef4444;
      --success: #10b981;
      --font-sans: 'Inter', sans-serif;
      --font-display: 'Space Grotesk', 'Inter', sans-serif;
      --radius-lg: 24px;
      --radius-md: 16px;
      --radius-sm: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-sans);
      background: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem 1rem;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient Background */
    .bg-shape {
      position: fixed;
      filter: blur(120px);
      z-index: -1;
      opacity: 0.6;
      border-radius: 50%;
      animation: float 20s infinite ease-in-out alternate;
    }
    .shape-1 {
      width: 400px; height: 400px;
      background: rgba(99, 102, 241, 0.3);
      top: -100px; left: -100px;
    }
    .shape-2 {
      width: 500px; height: 500px;
      background: rgba(20, 184, 166, 0.2);
      bottom: -200px; right: -100px;
      animation-delay: -5s;
    }
    .shape-3 {
      width: 300px; height: 300px;
      background: rgba(236, 72, 153, 0.15);
      top: 40%; left: 50%;
      transform: translate(-50%, -50%);
      animation-delay: -10s;
    }
    @keyframes float {
      0% { transform: translate(0, 0) rotate(0deg) scale(1); }
      100% { transform: translate(50px, 50px) rotate(10deg) scale(1.1); }
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      z-index: 1;
    }

    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .login-header .logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      border-radius: var(--radius-md);
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      margin-bottom: 1.25rem;
    }
    .login-header .logo i {
      font-size: 28px;
      color: var(--accent);
    }
    .login-header h1 {
      font-family: var(--font-display);
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }
    .login-header p {
      font-size: 14px;
      color: var(--text-muted);
    }

    .login-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 2rem;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.5);
    }

    /* Mode Toggle */
    .mode-toggle {
      display: flex;
      gap: 4px;
      background: rgba(0, 0, 0, 0.3);
      padding: 4px;
      border-radius: var(--radius-md);
      margin-bottom: 1.5rem;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .mode-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border-radius: 12px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .mode-btn:hover:not(.active) {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.05);
    }
    .mode-btn.active {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 4px 15px var(--accent-glow);
    }

    /* Form */
    .form-group {
      margin-bottom: 1.25rem;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .input-wrap {
      position: relative;
    }
    .input-wrap i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 18px;
      color: var(--text-muted);
      transition: color 0.3s;
    }
    .form-input {
      width: 100%;
      padding: 13px 14px 13px 44px;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(0, 0, 0, 0.3);
      color: var(--text-main);
      font-family: var(--font-sans);
      font-size: 15px;
      font-weight: 500;
      outline: none;
      transition: all 0.3s ease;
    }
    .form-input::placeholder {
      color: var(--text-muted);
      opacity: 0.5;
    }
    .form-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
      background: rgba(99, 102, 241, 0.05);
    }
    .form-input:focus + i,
    .form-input:focus ~ i {
      color: var(--accent);
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: var(--radius-md);
      background: var(--accent);
      color: #fff;
      font-family: var(--font-sans);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 20px var(--accent-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 0.5rem;
    }
    .btn-submit:hover:not(:disabled) {
      background: var(--accent-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 25px var(--accent-glow);
    }
    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* Error message */
    .error-msg {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      font-size: 13px;
      color: var(--danger);
      margin-bottom: 1rem;
      display: none;
      align-items: center;
      gap: 8px;
      animation: fadeIn 0.3s ease;
    }
    .error-msg.show { display: flex; }
    .error-msg i { font-size: 16px; }

    /* Success message */
    .success-msg {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.2);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      font-size: 13px;
      color: var(--success);
      margin-bottom: 1rem;
      display: none;
      align-items: center;
      gap: 8px;
      animation: fadeIn 0.3s ease;
    }
    .success-msg.show { display: flex; }
    .success-msg i { font-size: 16px; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Loading spinner */
    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="bg-shape shape-1"></div>
<div class="bg-shape shape-2"></div>
<div class="bg-shape shape-3"></div>

<div class="login-container">
  <div class="login-header">
    <div class="logo"><i class="ti ti-clock-bolt"></i></div>
    <h1>FocusData</h1>
    <p>Controla tu tiempo de estudio</p>
  </div>

  <div class="login-card">
    <div class="mode-toggle">
      <button class="mode-btn active" id="btn-mode-login" onclick="switchMode('login')">Iniciar Sesión</button>
      <button class="mode-btn" id="btn-mode-register" onclick="switchMode('register')">Registrarse</button>
    </div>

    <div class="error-msg" id="error-msg">
      <i class="ti ti-alert-circle"></i>
      <span id="error-text"></span>
    </div>

    <div class="success-msg" id="success-msg">
      <i class="ti ti-check"></i>
      <span id="success-text"></span>
    </div>

    <form id="auth-form" onsubmit="handleSubmit(event)">
      <div class="form-group">
        <label for="username">Usuario</label>
        <div class="input-wrap">
          <input type="text" id="username" class="form-input" placeholder="Tu nombre de usuario" autocomplete="username" required minlength="3" maxlength="30">
          <i class="ti ti-user" style="pointer-events:none;"></i>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="input-wrap">
          <input type="password" id="password" class="form-input" placeholder="Tu contraseña" autocomplete="current-password" required minlength="4">
          <i class="ti ti-lock" style="pointer-events:none;"></i>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="btn-submit">
        <i class="ti ti-login"></i>
        <span id="btn-text">Iniciar Sesión</span>
      </button>
    </form>
  </div>
</div>

<script>
  let mode = 'login';

  function switchMode(m) {
    mode = m;
    document.getElementById('btn-mode-login').classList.toggle('active', m === 'login');
    document.getElementById('btn-mode-register').classList.toggle('active', m === 'register');
    document.getElementById('btn-text').textContent = m === 'login' ? 'Iniciar Sesión' : 'Crear Cuenta';
    document.getElementById('btn-submit').querySelector('i').className = m === 'login' ? 'ti ti-login' : 'ti ti-user-plus';
    document.getElementById('password').minLength = (mode === 'register') ? 8 : 4;
    hideMessages();
  }

  function hideMessages() {
    document.getElementById('error-msg').classList.remove('show');
    document.getElementById('success-msg').classList.remove('show');
  }

  function showError(msg) {
    hideMessages();
    document.getElementById('error-text').textContent = msg;
    document.getElementById('error-msg').classList.add('show');
  }

  function showSuccess(msg) {
    hideMessages();
    document.getElementById('success-text').textContent = msg;
    document.getElementById('success-msg').classList.add('show');
  }

  async function handleSubmit(e) {
    e.preventDefault();
    hideMessages();

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('btn-submit');
    const btnText = document.getElementById('btn-text');
    const icon = btn.querySelector('i');

    if (!username || !password) {
      showError('Completa todos los campos');
      return;
    }

    // Loading state
    btn.disabled = true;
    const origText = btnText.textContent;
    const origIcon = icon.className;
    btnText.textContent = 'Cargando...';
    icon.className = '';
    const spinner = document.createElement('div');
    spinner.className = 'spinner';
    icon.replaceWith(spinner);

    try {
      const endpoint = mode === 'login' ? '/api/login' : '/api/register';
      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      const data = await res.json();

      if (!res.ok) {
        showError(data.error || 'Error inesperado');
        return;
      }

      if (mode === 'register') {
        showSuccess('¡Cuenta creada! Redirigiendo...');
      }

      setTimeout(() => { window.location.href = '/'; }, 500);

    } catch (err) {
      showError('Error de conexión con el servidor');
    } finally {
      // Restore button
      btn.disabled = false;
      btnText.textContent = origText;
      const newIcon = document.createElement('i');
      newIcon.className = origIcon;
      spinner.replaceWith(newIcon);
    }
  }

  // Focus first input
  document.getElementById('username').focus();
</script>
</body>
</html>
